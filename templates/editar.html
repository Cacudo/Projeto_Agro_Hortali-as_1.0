<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registo - AgroPulse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <i class="fa-solid fa-leaf"></i>
                <span>AgroPulse</span>
            </div>
            <ul class="nav-links">
                <li><a href="/"><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <header class="page-header">
            <h1>Editar Registo #{{ registo.id }}</h1>
            <p>Atualize as informações do talhão selecionado.</p>
        </header>

        <section class="card">
            <div class="card-title">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Formulário de Edição</span>
            </div>

            <form action="/editar/{{ registo.id }}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="talhao">Nome do Talhão</label>
                        <input type="text" id="talhao" name="talhao" value="{{ registo.talhao }}" required>
                    </div>

                    <div class="form-group">
                        <label for="cultura">Cultura</label>
                        <input type="text" id="cultura" name="cultura" value="{{ registo.cultura }}" required>
                    </div>

                    <div class="form-group">
                        <label for="area">Área (ha)</label>
                        <input type="number" step="0.1" id="area" name="area" value="{{ registo.area }}" required>
                    </div>

                    <div class="form-group">
                        <label for="dosagem">Dosagem (L/ha)</label>
                        <input type="number" step="0.1" id="dosagem" name="dosagem" value="{{ registo.dosagem }}" required>
                    </div>
                </div>

                <div class="form-actions" style="gap: 10px;">
                    <a href="/" class="btn-submit" style="background-color: #64748b; text-decoration: none;">Cancelar</a>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </section>
    </div>

</body>
</html>
