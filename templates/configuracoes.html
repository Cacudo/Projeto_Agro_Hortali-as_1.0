<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPulse - Configurações</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-leaf"></i></div>
                <span>AgroPulse</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/visao-geral"><i class="fa-solid fa-chart-pie"></i> Visão Geral</a>
                <a href="/pulverizacao"><i class="fa-solid fa-droplet"></i> Pulverização</a>
                <a href="/relatorios"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
                <a href="/configuracoes" class="active"><i class="fa-solid fa-gear"></i> Configurações</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-status"><span class="status-dot"></span> Sistema Ativo</div>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Configurações do Sistema</h1>
                <p>Gerencie as preferências da sua aplicação.</p>
            </header>

            <section class="card">
                <div class="card-header">
                    <i class="fa-solid fa-sliders"></i>
                    <h2>Preferências Gerais</h2>
                </div>
                <p style="color: #64748b;">Configurações de conta, unidades de medida e dados da propriedade.</p>
            </section>
        </main>
    </div>
</body>
</html>
